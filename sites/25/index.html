  </body>
  <script>
    const hand = document.querySelector(".stitched-hand");

    hand.addEventListener("click", () => {
      hand.classList.remove("is-clicking");
      void hand.getBoundingClientRect();
      hand.classList.add("is-clicking");
    });

    hand.addEventListener("animationend", (event) => {
      if (event.animationName === "hand-click") {
        hand.classList.remove("is-clicking");
      }
    });
  </script>
