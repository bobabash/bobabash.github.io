<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Death</title>
</head>
<body>
    <div id="dialogues">
        <div id="di1" class="dial">
            Have you ever thought...
        </div>
        <div id="di2" class="dial">
            of a time...
        </div>
        <div id="di3" class="dial">
            when the world still moves forward
        </div>
        <div id="di4" class="dial">
            cars still run, people still work...
        </div>
        <div id="di5" class="dial">
            Only this time...
        </div>
        <div id="di6" class="dial">
            you are not there anymore
        </div>
    </div>

    <div id="death">
        Death
    </div>
</body>
</html>
